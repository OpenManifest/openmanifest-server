# Whale watching: a boat takes passengers on a route to where whales are seen. No certifications or rental gear; children
# come with an adult; the daily log is the passenger list (_water) (GENERALISATION §5)
slug: whale_watching
extends: _water
name: Whale watching
description: Boats on whale-watching routes, a passenger list, children with an adult
icon: dolphin
vehicle_kinds: [boat]
crew_roles: [skipper, deckhand, naturalist]
modules:
  destinations: { kinds: [route], scope: per_load, max_per_load: 1 }
  activities: false
  certifications: false
  equipment: false
  # A child rides as the guest of an adult (GENERALISATION §10)
  escorts: {}
  crew: {}
  limits: false
call_schedule_minutes: [30, 15]
# Starting values of the operator's rules; the operator owns them afterwards
settings:
  require_equipment_inspection: false
  require_certification: false
  require_credits: false
  require_membership: false
  allow_negative_credits: false
  allow_manifest_bypass: false
  allow_double_manifesting: false
  require_equipment: false
  require_equipment_in_service: false
  allow_self_manifest: true
# A booking is for a trip that is scheduled ahead (GENERALISATION §17)
booking: { manifest_link: load }
