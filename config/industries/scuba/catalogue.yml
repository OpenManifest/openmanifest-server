# Global catalogue of the scuba template, seeded once by Setup::Global::Seeds (GENERALISATION §8). Recreational levels of the
# agencies a dive centre accepts, on one scale so that centres can cross-recognise them:
#   rank 10 supervised (to 12 m with a professional), 20 open water (18 m), 30 advanced (30 m), 40 rescue, 50 dive leader.
# The rank and equivalence_key are what requirements compare (a 30 m site asks for rank 30), never a body's own level.
# Qualifications share a slug across bodies (`nitrox`, `instructor`) so that a requirement accepts any accepted body's.
# Names are the agencies' own course names (see the P7.24 PR for the sources); ranks are defaults the owner reviews.
activity_types:
- name: Fun dive
  slug: fun_dive
- name: Night dive
  slug: night_dive
- name: Deep dive
  slug: deep_dive
- name: Wreck dive
  slug: wreck_dive
- name: Drift dive
  slug: drift_dive
- name: Training dive
  slug: training_dive
certification_bodies:
  padi:
    name: PADI
    slug: padi
    certification_levels:
    - name: Scuba Diver
      rank: 10
      equivalence_key: supervised
      permitted_activities:
      - fun_dive
      - training_dive
    - name: Open Water Diver
      rank: 20
      equivalence_key: open_water
      permitted_activities:
      - fun_dive
      - night_dive
      - drift_dive
      - training_dive
    - name: Advanced Open Water Diver
      rank: 30
      equivalence_key: advanced
      permitted_activities:
      - fun_dive
      - night_dive
      - deep_dive
      - wreck_dive
      - drift_dive
      - training_dive
    - name: Rescue Diver
      rank: 40
      equivalence_key: rescue
      permitted_activities:
      - fun_dive
      - night_dive
      - deep_dive
      - wreck_dive
      - drift_dive
      - training_dive
    - name: Divemaster
      rank: 50
      equivalence_key: dive_leader
      permitted_activities:
      - fun_dive
      - night_dive
      - deep_dive
      - wreck_dive
      - drift_dive
