mutation UpdateRigInspectionTemplate($operatorId: Int, $formId: Int, $definition: String) {
  updateFormTemplate(
    input: { id: $formId, attributes: { operatorId: $operatorId, definition: $definition } }
  ) {
    formTemplate {
      id
      name
      definition
    }
    fieldErrors {
      field
      message
    }
    errors
  }
}
