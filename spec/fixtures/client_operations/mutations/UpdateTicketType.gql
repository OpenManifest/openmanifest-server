mutation UpdateTicketType($id: Int!, $attributes: TicketTypeInput!) {
  updateTicketType(input: { id: $id, attributes: $attributes }) {
    errors
    fieldErrors {
      field
      message
    }
    ticketType {
      ...ticketTypeEssentials
      id
      name
      defaultDestination {
        ...destinationEssentials
      }
      costCents
      allowManifestingSelf
      extras {
        id
        name
        costCents
      }

      operator {
        ...operatorEssentials

        ticketTypes {
          ...ticketTypeEssentials
        }
      }
    }
  }
}
