mutation CreateOperator(
  $name: String!
  $banner: String
  $federation: Int!
  $lat: Float
  $lng: Float
  $primaryColor: String
  $secondaryColor: String
) {
  createOperator(
    input: {
      attributes: {
        name: $name
        banner: $banner
        federation: $federation
        primaryColor: $primaryColor
        secondaryColor: $secondaryColor
        lat: $lat
        lng: $lng
      }
    }
  ) {
    fieldErrors {
      field
      message
    }
    errors
    operator {
      ...operatorExtensive
    }
  }
}
