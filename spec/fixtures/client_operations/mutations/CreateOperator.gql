mutation CreateOperator(
  $industry: Industry!
  $name: String!
  $banner: String
  $certificationBodyIds: [Int!]
  $timeZone: String!
  $lat: Float
  $lng: Float
  $primaryColor: String
  $secondaryColor: String
) {
  createOperator(
    input: {
      industry: $industry
      attributes: {
        name: $name
        banner: $banner
        certificationBodyIds: $certificationBodyIds
        timeZone: $timeZone
        primaryColor: $primaryColor
        secondaryColor: $secondaryColor
        lat: $lat
        lng: $lng
      }
    }
  ) {
    fieldErrors {
      field
      message
    }
    errors
    operator {
      ...operatorExtensive
    }
  }
}
