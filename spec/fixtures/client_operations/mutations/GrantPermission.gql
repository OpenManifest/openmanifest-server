mutation GrantPermission($membershipId: ID!, $permissionName: Permission!) {
    grantPermission(input: { membership: $membershipId, permission: $permissionName }) {
      fieldErrors {
        message
        field
      }
      errors
      membership {
        ...membershipEssentials
        permissions
      }
      fieldErrors {
        field
        message
      }
      errors
    }
  }