mutation CreateAircraft(
  $attributes: PlaneInput!
) {
  createPlane(
    input: {
      attributes: $attributes
    }
  ) {
    plane {
      ...planeEssentials

      operator {
        id
        planes {
          ...planeEssentials
        }
      }
    }
    fieldErrors {
      field
      message
    }
    errors
  }
}