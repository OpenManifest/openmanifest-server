mutation CreateLoad(
  $name: String
  $pilot: ID
  $gca: ID
  $maxSlots: Int
  $vehicle: ID
  $vehicles: [LoadVehicleInput!]
  $crew: [LoadCrewInput!]
  $state: LoadState
  $destinationIds: [Int!]
) {
  createLoad(
    input: {
      attributes: {
        name: $name
        pilot: $pilot
        gca: $gca
        maxSlots: $maxSlots
        vehicle: $vehicle
        vehicles: $vehicles
        crew: $crew
        state: $state
        destinationIds: $destinationIds
      }
    }
  ) {
    load {
      ...loadDetails
    }
    fieldErrors {
      field
      message
    }
    errors
  }
}
