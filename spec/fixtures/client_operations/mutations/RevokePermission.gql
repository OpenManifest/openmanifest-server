mutation RevokePermission($membershipId: ID!, $permissionName: Permission!) {
  revokePermission(input: { membership: $membershipId, permission: $permissionName }) {
    fieldErrors {
      message
      field
    }
    errors
    membership {
      ...membershipEssentials
      permissions
    }
    fieldErrors {
      field
      message
    }
    errors
  }
}
