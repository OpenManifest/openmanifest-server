mutation CreateRigInspection($operator: ID, $rig: ID, $isOk: Boolean, $definition: String) {
  createRigInspection(
    input: {
      attributes: { operator: $operator, rig: $rig, isOk: $isOk, definition: $definition }
    }
  ) {
    rigInspection {
      ...rigInspectionMutationEssentials
    }
    fieldErrors {
      field
      message
    }
    errors
  }
}