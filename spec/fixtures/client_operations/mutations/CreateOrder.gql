#import "../fragments/orders.fragments.gql"
mutation CreateOrder(
  $buyer: ID!
  $seller: ID!
  $dropzone: ID!
  $title: String
  $amountCents: Int!
) {
  createOrder(
    input: {
      attributes: {
        dropzone: $dropzone
        title: $title
        buyer: $buyer
        seller: $seller
        amountCents: $amountCents
      }
    }
  ) {
    fieldErrors {
      field
      message
    }
    errors
    order {
      ...orderEssentials
    }
  }
}
