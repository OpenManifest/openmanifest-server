mutation MoveSlot($sourceSlot: Int!, $targetSlot: Int, $targetLoad: Int!, $targetLoadVehicle: Int) {
  moveSlot(
    input: {
      sourceSlot: $sourceSlot
      targetSlot: $targetSlot
      targetLoad: $targetLoad
      targetLoadVehicle: $targetLoadVehicle
    }
  ) {
    loads {
      ...loadDetails
    }
    errors
    fieldErrors {
      field
      message
    }
  }
}
