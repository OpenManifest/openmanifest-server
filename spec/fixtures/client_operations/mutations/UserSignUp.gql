mutation UserSignUp(
  $email: String!
  $password: String!
  $passwordConfirmation: String!
  $name: String!
  $phone: String!
  $pushToken: String
  $bodyMassKg: Float!
  $certificationLevelId: Int
) {
  userRegister(
    email: $email
    password: $password
    passwordConfirmation: $passwordConfirmation
    bodyMassKg: $bodyMassKg
    name: $name
    phone: $phone
    pushToken: $pushToken
    certificationLevelId: $certificationLevelId
    confirmUrl: "https://openmanifest.org/confirm/"
  ) {
    fieldErrors {
      field
      message
    }
    errors
    authenticatable {
      createdAt
      email
      id
      name
      phone
    }
    credentials {
      accessToken
      tokenType
      client
      expiry
      uid
    }
  }
}
