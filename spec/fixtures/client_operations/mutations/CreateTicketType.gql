mutation CreateTicketType($attributes: TicketTypeInput!) {
  createTicketType(input: { attributes: $attributes }) {
    errors
    fieldErrors {
      field
      message
    }
    ticketType {
      id
      name
      altitude
      costCents
      allowManifestingSelf
      extras {
        id
        name
        costCents
      }

      operator {
        id

        ticketTypes {
          id
          name
          altitude
          costCents
          allowManifestingSelf
          extras {
            id
            name
            costCents
          }
        }
      }
    }
  }
}
