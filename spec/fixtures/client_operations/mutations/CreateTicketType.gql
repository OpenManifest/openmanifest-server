mutation CreateTicketType($attributes: TicketTypeInput!) {
  createTicketType(input: { attributes: $attributes }) {
    errors
    fieldErrors {
      field
      message
    }
    ticketType {
      ...ticketTypeEssentials
      id
      name
      defaultDestination {
        ...destinationEssentials
      }
      costCents
      allowManifestingSelf
      extras {
        id
        name
        costCents
      }

      operator {
        id

        ticketTypes {
          id
          name
          defaultDestination {
            ...destinationEssentials
          }
          costCents
          allowManifestingSelf
          extras {
            id
            name
            costCents
          }
        }
      }
    }
  }
}
