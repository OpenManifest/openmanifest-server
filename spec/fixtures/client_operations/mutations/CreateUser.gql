mutation CreateGhost(
  $name: String!
  $phone: String
  $email: String!
  $certificationBodyNumber: String
  $role: Int!
  $certificationLevel: Int
  $operator: Int!
  $bodyMassKg: Float!
) {
  createGhost(
    input: {
      attributes: {
        role: $role
        certificationBodyNumber: $certificationBodyNumber
        name: $name
        phone: $phone
        email: $email
        operator: $operator
        certificationLevel: $certificationLevel
        bodyMassKg: $bodyMassKg
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }
    user {
      ...userDetailed
    }
  }
}
