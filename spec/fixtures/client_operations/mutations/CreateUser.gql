mutation CreateGhost(
  $name: String!
  $phone: String
  $email: String!
  $federationNumber: String
  $role: Int!
  $license: Int
  $operator: Int!
  $exitWeight: Float!
) {
  createGhost(
    input: {
      attributes: {
        role: $role
        federationNumber: $federationNumber
        name: $name
        phone: $phone
        email: $email
        operator: $operator
        license: $license
        exitWeight: $exitWeight
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }
    user {
      ...userDetailed
    }
  }
}
