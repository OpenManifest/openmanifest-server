mutation ManifestUser(
  $activityType: ID
  $extras: [ID!]
  $load: ID
  $rig: ID
  $ticketType: ID
  $membership: ID
  $bodyMassKg: Float
  $guestName: String
  $groupNumber: Int
  $guestBodyMassKg: Float
) {
  createSlot(
    input: {
      attributes: {
        activityType: $activityType
        extras: $extras
        load: $load
        rig: $rig
        groupNumber: $groupNumber
        ticketType: $ticketType
        membership: $membership
        bodyMassKg: $bodyMassKg
        guestBodyMassKg: $guestBodyMassKg
        guestName: $guestName
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }
    slot {
      ...slotExhaustive
    }
  }
}
