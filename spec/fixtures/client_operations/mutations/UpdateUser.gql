mutation UpdateUser(
  $membership: ID
  $name: String
  $phone: String
  $email: String
  $image: String
  $pushToken: String
  $nickname: String
  $license: Int
  $exitWeight: Float
) {
  updateUser(
    input: {
      membership: $membership
      attributes: {
        pushToken: $pushToken
        name: $name
        phone: $phone
        email: $email
        image: $image
        nickname: $nickname
        license: $license
        exitWeight: $exitWeight
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }
    membership {
      ...membershipDetails
    }
  }
}