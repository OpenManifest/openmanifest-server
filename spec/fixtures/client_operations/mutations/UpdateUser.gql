mutation UpdateUser(
  $membership: ID
  $name: String
  $phone: String
  $email: String
  $image: String
  $pushToken: String
  $nickname: String
  $certificationLevel: Int
  $bodyMassKg: Float
  $dateOfBirth: ISO8601Date
) {
  updateUser(
    input: {
      membership: $membership
      attributes: {
        pushToken: $pushToken
        name: $name
        phone: $phone
        email: $email
        image: $image
        nickname: $nickname
        certificationLevel: $certificationLevel
        bodyMassKg: $bodyMassKg
        dateOfBirth: $dateOfBirth
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }
    membership {
      ...membershipDetails
    }
  }
}
