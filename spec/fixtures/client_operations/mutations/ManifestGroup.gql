mutation ManifestGroup(
  $activityType: ID
  $extras: [ID!]
  $load: ID
  $ticketType: ID
  $groupNumber: Int
  $userGroup: [SlotUser!]!
) {
  createSlots(
    input: {
      attributes: {
        activityType: $activityType
        groupNumber: $groupNumber
        extras: $extras
        load: $load
        ticketType: $ticketType
        userGroup: $userGroup
      }
    }
  ) {
    errors
    fieldErrors {
      field
      message
    }

    load {
      ...loadDetails
    }
  }
}
