#import "./orders.fragments.gql"
#import "./transactions.fragments.gql"
#import "./users.fragments.gql"

fragment currentUserEssentials on Membership {
  id
  walletId
  creditsCents
  hasCredits
  hasBodyMassKg
  hasMembership
  hasEquipmentInService
  hasEquipmentInspection
  hasCertificationLevel
  permissions
  expiresAt

  role {
    ...roleEssentials
  }
}

fragment currentUserDetailed on Membership {
  ...currentUserEssentials

  equipmentInspections {
    ...equipmentInspectionEssentials
  }

  orders {
    edges {
      node {
        ...orderEssentials
      }
    }
  }
  availableEquipment {
    ...equipmentEssentials
  }
  certificationLevel {
    ...certificationLevelDetails
  }

  user {
    ...currentUser
  }
}
