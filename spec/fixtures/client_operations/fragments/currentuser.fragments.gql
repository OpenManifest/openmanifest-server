#import "./orders.fragments.gql"
#import "./transactions.fragments.gql"
#import "./users.fragments.gql"

fragment currentUserEssentials on Membership {
  id
  walletId
  creditsCents
  hasCredits
  hasBodyMassKg
  hasMembership
  hasReserveInDate
  hasRigInspection
  hasCertificationLevel
  permissions
  expiresAt

  role {
    ...roleEssentials
  }
}

fragment currentUserDetailed on Membership {
  ...currentUserEssentials

  rigInspections {
    ...rigInspectionEssentials
  }

  orders {
    edges {
      node {
        ...orderEssentials
      }
    }
  }
  availableRigs {
    ...rigEssentials
  }
  certificationLevel {
    ...certificationLevelDetails
  }

  user {
    ...currentUser
  }
}
