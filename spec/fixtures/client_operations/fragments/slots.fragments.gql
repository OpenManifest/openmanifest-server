fragment guestEssentials on Guest {
  id
  name
  bodyMassKg
  email
  phone
  dateOfBirth
  emergencyContact
}

fragment slotEssentials on Slot {
  id
  lockVersion
  createdAt
  bodyMassKg
  guestSlots {
    id
    bodyMassKg
    guest {
      ...guestEssentials
    }
  }
  wingLoading
  groupNumber
  costCents
  ticketType {
    ...ticketTypeDetails
  }
  destination {
    ...destinationEssentials
  }
  loadVehicle {
    id
  }
  activityType {
    ...activityTypeEssentials
  }
  extras {
    id
    name
  }
}

fragment slotDetails on Slot {
  ...slotEssentials
  equipment {
    ...equipmentEssentials
  }
  membership {
    ...membershipEssentials
  }
}

fragment userSlotDetails on Slot {
  ...slotDetails
  load {
    ...loadEssentials
  }
}

fragment slotExhaustive on Slot {
  ...slotDetails
  membership {
    ...membershipDetails
  }
  load {
    ...loadDetails
  }
  equipment {
    ...equipmentEssentials
  }
}
