fragment slotEssentials on Slot {
  id
  lockVersion
  createdAt
  exitWeight
  passengerName
  passengerExitWeight
  wingLoading
  groupNumber
  costCents
  ticketType {
    ...ticketTypeDetails
  }
  jumpType {
    ...jumpTypeEssentials
  }
  extras {
    id
    name
  }
}

fragment slotDetails on Slot {
  ...slotEssentials
  rig {
    ...rigEssentials
  }
  membership {
    ...membershipEssentials
  }
}

fragment userSlotDetails on Slot {
  ...slotDetails
  load {
    ...loadEssentials
  }
}

fragment slotExhaustive on Slot {
  ...slotDetails
  membership {
    ...membershipDetails
  }
  load {
    ...loadDetails
  }
  rig {
    ...rigEssentials
  }
}
