fragment userEssentials on User {
  id
  name
  nickname
  phone
  email
  bodyMassKg
  dateOfBirth
  moderationRole
  image
}

fragment userDetailed on User {
  ...userEssentials
  userCertifications {
    ...userCertificationEssentials
  }
  equipment {
    ...userEquipmentDetailed
  }
}

fragment currentUser on User {
  ...userDetailed
  memberships {
    ...membershipDetails
  }
  pushToken
}
