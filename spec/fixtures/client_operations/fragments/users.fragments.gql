fragment userEssentials on User {
  id
  name
  nickname
  phone
  email
  bodyMassKg
  moderationRole
  image
  apfNumber
}

fragment userDetailed on User {
  ...userEssentials
  userFederations {
    ...userFederationEssentials
  }
  rigs {
    ...userRigDetailed
  }
}

fragment currentUser on User {
  ...userDetailed
  memberships {
    ...membershipDetails
  }
  pushToken
}
