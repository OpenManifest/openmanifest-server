fragment membershipEssentials on Membership {
  id
  walletId
  expiresAt
  hasCredits
  hasMembership
  hasCertificationLevel
  hasBodyMassKg
  role {
    ...roleEssentials
  }
  certificationLevel {
    ...certificationLevelEssentials
  }
  user {
    ...userEssentials
  }
}

fragment membershipDetails on Membership {
  ...membershipEssentials
  creditsCents
  certificationLevel {
    ...certificationLevelDetails
  }
  user {
    ...userDetailed
  }
  availableRigs {
    ...rigEssentials
  }
}

fragment membershipProfile on Membership {
  ...membershipDetails
  permissions

  rigInspections {
    ...rigInspectionEssentials
  }

  orders {
    edges {
      node {
        ...orderEssentials
      }
    }
  }

  slots {
    edges {
      node {
        ...userSlotDetails
      }
    }
  }
}
