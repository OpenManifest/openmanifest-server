#import "./slot.gql"

fragment loadEssentials on Load {
  id
  lockVersion
  name
  createdAt
  dispatchAt
  hasCompleted
  loadNumber
  isFull
  state
  isOpen
  weight
  maxSlots
  availableSlots
  occupiedSlots
}

fragment loadDetails on Load {
  ...loadEssentials
  vehicle {
    ...vehicleEssentials
  }
  gca {
    ...membershipEssentials
  }
  pilot {
    ...membershipEssentials
  }
  loadMaster {
    ...membershipEssentials
  }
  slots {
    ...slotDetails
  }
}
