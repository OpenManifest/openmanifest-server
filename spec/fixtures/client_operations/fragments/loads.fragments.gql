#import "./slot.gql"

fragment loadEssentials on Load {
  id
  lockVersion
  name
  createdAt
  dispatchAt
  hasLanded
  loadNumber
  isFull
  state
  isOpen
  weight
  maxSlots
  availableSlots
  occupiedSlots
}

fragment loadDetails on Load {
  ...loadEssentials
  plane {
    ...planeEssentials
  }
  gca {
    ...membershipEssentials
  }
  pilot {
    ...membershipEssentials
  }
  loadMaster {
    ...membershipEssentials
  }
  slots {
    ...slotDetails
  }
}
