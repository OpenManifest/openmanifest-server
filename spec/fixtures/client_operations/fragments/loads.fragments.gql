#import "./slot.gql"

fragment loadVehicleEssentials on LoadVehicle {
  id
  role
  position
  capacity
  slotsCount
  vehicle {
    ...vehicleEssentials
  }
}

fragment loadEssentials on Load {
  id
  lockVersion
  name
  createdAt
  dispatchAt
  calledAt
  loadDate
  departedAt
  completedAt
  hasCompleted
  loadNumber
  isFull
  state
  isOpen
  weight
  maxSlots
  availableSlots
  occupiedSlots
}

# What a card of the board shows: the load with its vehicles, crew and destinations, without its slots
fragment loadCard on Load {
  ...loadEssentials
  vehicle {
    ...vehicleEssentials
  }
  vehicles {
    ...loadVehicleEssentials
  }
  crew {
    ...loadCrewEssentials
  }
  destinations {
    ...destinationEssentials
  }
}

fragment loadDetails on Load {
  ...loadEssentials
  vehicle {
    ...vehicleEssentials
  }
  vehicles {
    ...loadVehicleEssentials
  }
  crew {
    ...loadCrewEssentials
  }
  gca {
    ...membershipEssentials
  }
  pilot {
    ...membershipEssentials
  }
  loadMaster {
    ...membershipEssentials
  }
  destinations {
    ...destinationEssentials
  }
  slots {
    ...slotDetails
  }
}
