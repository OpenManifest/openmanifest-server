#import "./slot.gql"

fragment loadVehicleEssentials on LoadVehicle {
  id
  role
  position
  capacity
  slotsCount
  vehicle {
    ...vehicleEssentials
  }
}

fragment loadEssentials on Load {
  id
  lockVersion
  name
  createdAt
  dispatchAt
  hasCompleted
  loadNumber
  isFull
  state
  isOpen
  weight
  maxSlots
  availableSlots
  occupiedSlots
}

fragment loadDetails on Load {
  ...loadEssentials
  vehicle {
    ...vehicleEssentials
  }
  vehicles {
    ...loadVehicleEssentials
  }
  gca {
    ...membershipEssentials
  }
  pilot {
    ...membershipEssentials
  }
  loadMaster {
    ...membershipEssentials
  }
  destinations {
    ...destinationEssentials
  }
  slots {
    ...slotDetails
  }
}
