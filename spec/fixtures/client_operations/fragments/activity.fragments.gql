fragment activityEssentials on Event {
  action
  id
  level
  message
  details
  createdAt
  createdBy {
    ...membershipEssentials
  }
}

fragment activityDetails on Event {
  ...activityEssentials
  resource {
    ... on Operator {
      ...operatorEssentials
    }
    ... on Membership {
      ...membershipEssentials
    }
    ... on Load {
      ...loadEssentials
    }
    ... on Slot {
      ...slotEssentials
    }
    ... on Equipment {
      ...equipmentEssentials
    }
    ... on Vehicle {
      ...vehicleEssentials
    }
  }
}
