query Activity(
  $operator: [ID!]
  $levels: [EventLevel!]
  $actions: [EventAction!]
  $accessLevels: [EventAccessLevel!]
  $timeRange: TimeRangeInput
  $createdBy: [ID!]
) {
  activity(
    operator: $operator
    timeRange: $timeRange
    accessLevels: $accessLevels
    levels: $levels
    actions: $actions
    createdBy: $createdBy
  ) {
    edges {
      node {
        ...activityEssentials
      }
    }
  }
}

query ActivityDetails(
  $operator: [ID!]
  $levels: [EventLevel!]
  $actions: [EventAction!]
  $accessLevels: [EventAccessLevel!]
  $timeRange: TimeRangeInput
  $createdBy: [ID!]
  $after: String
) {
  activity(
    operator: $operator
    timeRange: $timeRange
    accessLevels: $accessLevels
    levels: $levels
    actions: $actions
    createdBy: $createdBy
    after: $after
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...activityDetails
      }
    }
  }
}
