query Notifications($operatorId: ID!) {
  operator(id: $operatorId) {
    id

    currentUser {
      id

      notifications {
        edges {
          node {
            id
            message
            notificationType
            createdAt
            sentBy {
              id
              user {
                id
                name
              }
            }

            resource {
              ... on Load {
                ...loadEssentials
              }
              ... on Transaction {
                id
                amountCents
                message
                status
              }

              ... on Slot {
                ...slotEssentials
              }

              ... on Rig {
                ...rigEssentials
                rigInspections(operatorId: $operatorId) {
                  id
                  createdAt
                  inspectedBy {
                    id
                    user {
                      id
                      name
                    }
                  }
                }
              }

              ... on RigInspection {
                ...rigInspectionEssentials
              }
            }
          }
        }
      }
    }
  }
}
