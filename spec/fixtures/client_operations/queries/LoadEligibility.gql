#import "../fragments/eligibility.fragments.gql"

# Whether each person on a load is ready to fly: the load screen shows it beside their name
query LoadEligibility($id: ID!) {
  load(id: $id) {
    id
    slots {
      id
      membership {
        id
        eligibility {
          ready
          rules {
            ...eligibilityResultEssentials
          }
        }
      }
    }
  }
}
